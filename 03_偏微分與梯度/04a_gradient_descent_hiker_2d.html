<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #1c1c1a;
    color: #1a1a18;
    margin: 0;
    padding: 20px 14px 50px;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 620px; }
  .card { background: #101010; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.4); }

  .titlebar {
    background: #0b0b0b; color: #fff; padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
  }
  .titlebar .t1 { font-size: 15px; font-weight: 500; }
  .titlebar .t2 { font-size: 11px; color: #b8b6ac; margin-top: 3px; }
  .titlebar .step { font-size: 12px; color: #f5d76e; white-space: nowrap; margin-top: 2px; }

  .scene { position: relative; width: 100%; background: #cfe8f5; }
  .scene svg { display: block; width: 100%; height: auto; }

  .intuition {
    position: absolute; left: 14px; top: 14px; width: 190px;
    background: #fbfbf8; border-radius: 10px; padding: 10px 12px;
    font-size: 11.5px; line-height: 1.6; color: #2c2c2a;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .intuition b { display: block; margin-bottom: 2px; }
  .intuition .red { color: #c0392b; font-weight: 500; }

  .stats-panel { background: #0b0b0b; color: #e8e7e0; padding: 16px 18px 12px; }
  .stats-panel h3 { font-size: 13px; font-weight: 500; color: #cfcec5; margin: 0 0 10px; }
  .formula { text-align: center; font-size: 17px; color: #f5f4ef; padding: 4px 0 16px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; row-gap: 14px; column-gap: 10px; }
  .stat-label { font-size: 11.5px; color: #8f8d84; margin-bottom: 3px; }
  .stat-value { font-size: 15px; font-family: "SF Mono", Consolas, monospace; color: #fff; }
  .stat-value.loss { color: #ff8a65; }

  .controls { background: #16150f; padding: 14px 18px 18px; }
  .lr-row { display: flex; align-items: center; gap: 10px; margin-bottom: 2px; }
  .lr-row label { font-size: 12.5px; color: #b8b6ac; min-width: 56px; }
  .lr-row input[type=range] { flex: 1; }
  .lr-row span { font-size: 12.5px; font-weight: 500; min-width: 42px; text-align: right; color: #fff; }
  .ticks { display: flex; justify-content: space-between; font-size: 10.5px; color: #77756c; padding: 0 2px 10px; }
  #gd-hint { font-size: 11.5px; margin: -4px 0 10px; display: none; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    padding: 8px 14px; font-size: 12.5px; border-radius: 8px;
    border: 1px solid #3a3934; background: #201f1a; color: #e8e7e0; cursor: pointer;
  }
  button:disabled { opacity: 0.4; cursor: default; }
  button:hover:not(:disabled) { background: #2b2a24; }
  #gd-converged { font-size: 12.5px; margin-top: 10px; display: none; }
</style>
<style id="pu-badge-style">
.pu-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.pu-hd-main{min-width:0;flex:1}
.pu-badge{display:flex;align-items:center;gap:10px;flex:none;padding:8px 12px;border:1px solid var(--line,#e3e1da);border-radius:12px;background:var(--card,var(--surface,#fff));color:var(--ink,#1d2330);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
.pu-badge img{width:58px;height:58px;display:block}
.pu-badge .pu-t{display:flex;flex-direction:column;line-height:1.35;font-size:.9rem;text-align:left}
.pu-badge .pu-t b{font-size:1.05rem}
.pu-badge .pu-t span{color:var(--mute,var(--muted,#667085))}
@media (max-width:700px){.pu-hd{flex-direction:column-reverse}.pu-badge{align-self:flex-end}}

.pu-row{justify-content:flex-end}
@media (max-width:700px){.pu-row{flex-direction:row}}
</style>
</head>

<script>
(function(){
const HEIGHT_SCALE=0.28;
function lossOf(x,z){ return (x*x+z*z)*HEIGHT_SCALE; }
const EPS=0.01;
function gradOf(x,z){
  return [(lossOf(x+EPS,z)-lossOf(x-EPS,z))/(2*EPS),(lossOf(x,z+EPS)-lossOf(x,z-EPS))/(2*EPS)];
}
function randomStart(){
  return { x: -2.6 + Math.random()*1.4, z: 1.0 + Math.random()*1.2 };
}
const LR_MIN=0.02, LR_MAX=4.0;
const OSC_LR=1/(2*HEIGHT_SCALE);
const DIVERGE_LR=2/(2*HEIGHT_SCALE);
const sliderToLr=t=>LR_MIN*Math.pow(LR_MAX/LR_MIN,t);
const lrToSlider=lr=>Math.log(lr/LR_MIN)/Math.log(LR_MAX/LR_MIN);

const FLAG_X=560, FLAG_Y=300;
function project(x,z){
  const sx = FLAG_X + (x - z) * 50;
  const sy = FLAG_Y + (x + z) * 24 - lossOf(x,z) * 55;
  return [sx,sy];
}

const svgNS="http://www.w3.org/2000/svg";
const pathEl=document.getElementById("descent-path");
const startDot=document.getElementById("start-dot");
const hikerEl=document.getElementById("hiker");
const arrowLine=document.getElementById("arrow-line");
const tagUp=document.getElementById("tag-gradup");
const tagDown=document.getElementById("tag-graddown");
const tagValley=document.getElementById("tag-valley");
tagValley.setAttribute("transform","translate("+(FLAG_X+16)+","+(FLAG_Y-14)+")");

let pathPoints=[];
let visualPos=randomStart();
let queue=[];
let walking=false, walkFrom=null, walkTo=null, walkStartTime=0, walkDuration=520;
let walkPhase=0, lastScreenX=null;
let steps=0, lr=0.3, playing=false, converged=false, playTimer=null;

function updatePathString(){
  if(pathPoints.length===0){ pathEl.setAttribute("d",""); return; }
  let d="M"+pathPoints[0][0].toFixed(1)+","+pathPoints[0][1].toFixed(1);
  for(let i=1;i<pathPoints.length;i++) d+=" L"+pathPoints[i][0].toFixed(1)+","+pathPoints[i][1].toFixed(1);
  pathEl.setAttribute("d",d);
}

function placeTag(g,x,y){ g.setAttribute("transform","translate("+x.toFixed(1)+","+y.toFixed(1)+")"); }

function updateOverlay(x,z, forceFacing){
  const [sx,sy]=project(x,z);
  const bounce = walking ? Math.abs(Math.sin(walkPhase))*3 : 0;
  let facing = lastScreenX===null ? 1 : (sx>=lastScreenX ? 1 : -1);
  if(forceFacing!==undefined) facing=forceFacing;
  hikerEl.setAttribute("transform","translate("+sx.toFixed(1)+","+(sy-bounce).toFixed(1)+") scale("+facing+",1)");

  const [gx,gz]=gradOf(x,z);
  let dx=-gx, dz=-gz;
  const dlen=Math.hypot(dx,dz)||1;
  dx/=dlen; dz/=dlen;
  const [sx2,sy2]=project(x+dx*0.4, z+dz*0.4);
  let avx=sx2-sx, avy=sy2-sy;
  const avlen=Math.hypot(avx,avy)||1;
  avx=avx/avlen*58; avy=avy/avlen*58;
  arrowLine.setAttribute("x1",sx.toFixed(1)); arrowLine.setAttribute("y1",(sy-14).toFixed(1));
  arrowLine.setAttribute("x2",(sx+avx).toFixed(1)); arrowLine.setAttribute("y2",(sy-14+avy).toFixed(1));

  placeTag(tagUp, sx-24, sy-64);
  placeTag(tagDown, sx+avx-30, sy-14+avy+8);

  return [sx,sy];
}

function formatPos(x,z){ return "θ = ("+x.toFixed(3)+", "+z.toFixed(3)+")"; }
function formatGrad(gx,gz){ return "["+gx.toFixed(3)+", "+gz.toFixed(3)+"]"; }

const stepsEl=document.getElementById("gd-step-no");
const posEl=document.getElementById("stat-pos"), lossElS=document.getElementById("stat-loss");
const gradEl=document.getElementById("stat-grad"), iterEl=document.getElementById("stat-iter");
const lrInput=document.getElementById("gd-lr"), lrVal=document.getElementById("gd-lr-val"), ticksEl=document.getElementById("gd-ticks");
const hintEl=document.getElementById("gd-hint"), convEl=document.getElementById("gd-converged");
const stepBtn=document.getElementById("gd-step-btn"), playBtn=document.getElementById("gd-play-btn"), resetBtn=document.getElementById("gd-reset-btn");

[0,0.25,0.5,0.75,1].forEach(t=>{
  const v=sliderToLr(t);
  const s=document.createElement("span");
  s.textContent=v.toFixed(2);
  ticksEl.appendChild(s);
});

function refreshUI(){
  stepsEl.textContent=steps;
  const [gx,gz]=gradOf(visualPos.x,visualPos.z);
  posEl.textContent=formatPos(visualPos.x,visualPos.z);
  lossElS.textContent=lossOf(visualPos.x,visualPos.z).toFixed(3);
  gradEl.textContent=formatGrad(gx,gz);
  iterEl.textContent=steps;
  lrInput.value=lrToSlider(lr);
  lrVal.textContent=lr.toFixed(2);
  if(lr>=OSC_LR){
    hintEl.style.display="block";
    if(lr>=DIVERGE_LR){hintEl.style.color="#ff8a80";hintEl.textContent="學習率過大:每一步都往反方向跨得更遠,呈現發散";}
    else{hintEl.style.color="#ffcc80";hintEl.textContent="學習率偏大:每一步跨過最小值到另一側,呈現收斂中的震盪";}
  } else { hintEl.style.display="none"; }
  playBtn.textContent=playing?"暫停":"自動下山";
  stepBtn.disabled=converged;
  playBtn.disabled=converged;
  if(converged){
    convEl.style.display="block";
    convEl.style.color="#8fe3c0";
    convEl.textContent="已抵達山谷最低點 θ*,按「重新開始」換一個起始點。";
  } else { convEl.style.display="none"; }
}

function enqueueStep(){
  const base = queue.length>0 ? queue[queue.length-1] : visualPos;
  const [gx,gz]=gradOf(base.x,base.z);
  const nx=base.x-lr*gx, nz=base.z-lr*gz;
  queue.push({x:nx,z:nz});
}
function stopPlaying(){playing=false;if(playTimer){clearInterval(playTimer);playTimer=null;}}
function togglePlay(){
  if(playing){stopPlaying();}
  else{playing=true;playTimer=setInterval(function(){ if(!converged) enqueueStep(); },520);}
  refreshUI();
}
function reset(){
  stopPlaying();
  queue=[]; walking=false; pathPoints=[];
  visualPos=randomStart(); steps=0; converged=false;
  const [sx,sy]=project(visualPos.x,visualPos.z);
  pathPoints.push([sx,sy]);
  updatePathString();
  startDot.style.display="block";
  startDot.setAttribute("cx",sx.toFixed(1)); startDot.setAttribute("cy",sy.toFixed(1));
  lastScreenX=null;
  updateOverlay(visualPos.x,visualPos.z);
  refreshUI();
}

lrInput.addEventListener("input",function(e){lr=sliderToLr(parseFloat(e.target.value));refreshUI();});
stepBtn.addEventListener("click",function(){ if(!converged) enqueueStep(); });
playBtn.addEventListener("click",togglePlay);
resetBtn.addEventListener("click",reset);

let lastTime=performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min(50, now-lastTime); lastTime=now;

  if(!walking && queue.length>0){
    walkFrom={x:visualPos.x,z:visualPos.z};
    walkTo=queue.shift();
    walkStartTime=now;
    walkDuration=460;
    walking=true;
  }

  if(walking){
    let t=(now-walkStartTime)/walkDuration;
    if(t>=1){
      t=1;
      visualPos={x:walkTo.x,z:walkTo.z};
      steps++;
      const [sx,sy]=project(visualPos.x,visualPos.z);
      pathPoints.push([sx,sy]);
      updatePathString();
      walking=false;
      const [ngx,ngz]=gradOf(visualPos.x,visualPos.z);
      if(Math.hypot(ngx,ngz)<0.05){converged=true;stopPlaying();queue=[];}
      const before=lastScreenX;
      lastScreenX=sx;
      updateOverlay(visualPos.x,visualPos.z, before===null?1:(sx>=before?1:-1));
      refreshUI();
    } else {
      const ease=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
      const cx=walkFrom.x+(walkTo.x-walkFrom.x)*ease;
      const cz=walkFrom.z+(walkTo.z-walkFrom.z)*ease;
      walkPhase+=dt*0.02;
      const [sx]=project(cx,cz);
      const facing = lastScreenX===null ? 1 : (sx>=lastScreenX?1:-1);
      updateOverlay(cx,cz,facing);
    }
  }

  requestAnimationFrame;
}
requestAnimationFrame(animate);

reset();
})();
</script>
</body>
