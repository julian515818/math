<h2 class="sr-only">3D 梯度下降互動示範,學習率範圍已調整為 0.001 到 0.1</h2>
<div id="gd3d-mount" style="width:100%;height:300px;border-radius:12px;overflow:hidden;background:var(--surface-1);border:0.5px solid var(--border);"></div>
<div style="display:flex;gap:16px;margin:12px 0 8px;font-size:13px;color:var(--text-secondary);flex-wrap:wrap;">
  <span>步數:<strong id="gd-steps" style="color:var(--text-primary);">0</strong></span>
  <span>x:<strong id="gd-x" style="color:var(--text-primary);">0</strong></span>
  <span>z:<strong id="gd-z" style="color:var(--text-primary);">0</strong></span>
  <span>loss:<strong id="gd-loss" style="color:#d85a30;">0</strong></span>
</div>
<div style="display:flex;align-items:center;gap:10px;margin-bottom:2px;">
  <label style="font-size:13px;color:var(--text-secondary);min-width:56px;">學習率</label>
  <input type="range" id="gd-lr" min="0" max="1" step="0.001" style="flex:1;">
  <span id="gd-lr-val" style="font-size:13px;font-weight:500;min-width:48px;text-align:right;color:var(--text-primary);">0.020</span>
</div>
<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);padding:0 2px 10px;" id="gd-ticks"></div>
<p id="gd-hint" style="font-size:12px;margin:-6px 0 12px;display:none;"></p>
<div style="display:flex;gap:8px;flex-wrap:wrap;">
  <button id="gd-step-btn">單步 ↗</button>
  <button id="gd-play-btn">自動播放</button>
  <button id="gd-reset-btn">重新開始</button>
</div>
<p id="gd-converged" style="font-size:13px;margin-top:10px;display:none;"></p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const DOMAIN=3, BASE=0.09;
const WELLS=[
  {x:0,z:0,depth:39,sigma:1.0,label:"全域最小值",kind:"global"},
  {x:-2.0,z:1.3,depth:28.5,sigma:0.9,label:"區域最小值 A",kind:"local"},
  {x:1.9,z:-1.6,depth:27,sigma:0.85,label:"區域最小值 B",kind:"local"},
  {x:-1.6,z:-2.0,depth:24,sigma:0.8,label:"區域最小值 C",kind:"local"}
];
const LOCAL_WELLS=WELLS.filter(w=>w.kind==="local");
function lossOf(x,z){
  let v=BASE*(x*x+z*z);
  for(const w of WELLS){const dx=x-w.x,dz=z-w.z;v-=w.depth*Math.exp(-(dx*dx+dz*dz)/(2*w.sigma*w.sigma));}
  return v;
}
function surfaceY(x,z){return Math.cbrt(lossOf(x,z));}
const EPS=0.01;
function gradOf(x,z){
  return [(lossOf(x+EPS,z)-lossOf(x-EPS,z))/(2*EPS),(lossOf(x,z+EPS)-lossOf(x,z-EPS))/(2*EPS)];
}
function nearestWell(x,z){
  let best=WELLS[0],bd=Infinity;
  for(const w of WELLS){const d=Math.hypot(x-w.x,z-w.z);if(d<bd){bd=d;best=w;}}
  return best;
}
function randomStart(){
  if(Math.random()<0.7){
    const w=LOCAL_WELLS[Math.floor(Math.random()*LOCAL_WELLS.length)];
    const a=Math.random()*Math.PI*2,r=0.3+Math.random()*0.5;
    return {x:w.x+Math.cos(a)*r,z:w.z+Math.sin(a)*r};
  }
  const a=Math.random()*Math.PI*2,r=0.4+Math.random()*2.3;
  return {x:Math.cos(a)*r,z:Math.sin(a)*r};
}
const LR_MIN=0.001, LR_MAX=0.1, LR_ESCAPE=0.025, LR_UNSTABLE=0.05;
const sliderToLr=t=>LR_MIN*Math.pow(LR_MAX/LR_MIN,t);
const lrToSlider=lr=>Math.log(lr/LR_MIN)/Math.log(LR_MAX/LR_MIN);

const mount=document.getElementById("gd3d-mount");
const width=mount.clientWidth, height=300;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,width/height,0.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(width,height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
mount.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,0.65));
const dirLight=new THREE.DirectionalLight(0xffffff,0.7);
dirLight.position.set(4,6,3);
scene.add(dirLight);

const N=40;
const geo=new THREE.PlaneGeometry(DOMAIN*2,DOMAIN*2,N,N);
geo.rotateX(-Math.PI/2);
const posAttr=geo.attributes.position;
for(let i=0;i<posAttr.count;i++){
  const x=posAttr.getX(i), z=posAttr.getZ(i);
  posAttr.setY(i,surfaceY(x,z));
}
geo.computeVertexNormals();
const surfMat=new THREE.MeshStandardMaterial({color:0xb5d4f4,metalness:0.05,roughness:0.85,side:THREE.DoubleSide});
const surface=new THREE.Mesh(geo,surfMat);
scene.add(surface);
const wireMat=new THREE.MeshBasicMaterial({color:0x185fa5,wireframe:true,transparent:true,opacity:0.18,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
surface.add(new THREE.Mesh(geo,wireMat));

WELLS.forEach(w=>{
  const marker=new THREE.Mesh(new THREE.SphereGeometry(w.kind==="global"?0.07:0.055,16,16),new THREE.MeshBasicMaterial({color:w.kind==="global"?0x042c53:0x5f5e5a}));
  marker.position.set(w.x,surfaceY(w.x,w.z)+0.012,w.z);
  scene.add(marker);
});

const ball=new THREE.Mesh(new THREE.SphereGeometry(0.11,20,20),new THREE.MeshStandardMaterial({color:0xd85a30,roughness:0.4}));
scene.add(ball);
const arrowsGroup=new THREE.Group();
scene.add(arrowsGroup);
const UP=new THREE.Vector3(0,1,0);
function createArrow(from,to){
  const dir=new THREE.Vector3().subVectors(to,from);
  const length=dir.length();
  if(length<1e-4) return null;
  const headLength=Math.min(0.16,length*0.45), headRadius=0.055, shaftRadius=0.028;
  const shaftLength=Math.max(length-headLength,0.001);
  const group=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color:0xd85a30,roughness:0.35,metalness:0.05});
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(shaftRadius,shaftRadius,shaftLength,10),mat);
  shaft.position.y=shaftLength/2;
  group.add(shaft);
  const head=new THREE.Mesh(new THREE.ConeGeometry(headRadius,headLength,12),mat);
  head.position.y=shaftLength+headLength/2;
  group.add(head);
  group.quaternion.copy(new THREE.Quaternion().setFromUnitVectors(UP,dir.clone().normalize()));
  group.position.copy(from);
  return group;
}
function disposeArrow(g){g.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});}

const orbit={azimuth:0.7,polar:0.95,radius:9.2};
function updateCamera(){
  const {azimuth,polar,radius}=orbit;
  camera.position.set(radius*Math.sin(polar)*Math.sin(azimuth),radius*Math.cos(polar),radius*Math.sin(polar)*Math.cos(azimuth));
  camera.lookAt(0,-0.9,0);
}
updateCamera();
let dragging=false,lastX=0,lastY=0,idleSpin=true;
function onDown(e){dragging=true;idleSpin=false;const p=e.touches?e.touches[0]:e;lastX=p.clientX;lastY=p.clientY;}
function onMove(e){if(!dragging)return;const p=e.touches?e.touches[0]:e;const dx=p.clientX-lastX,dy=p.clientY-lastY;lastX=p.clientX;lastY=p.clientY;orbit.azimuth+=dx*0.006;orbit.polar=Math.min(1.45,Math.max(0.25,orbit.polar-dy*0.006));updateCamera();}
function onUp(){dragging=false;}
const dom=renderer.domElement;
dom.style.touchAction="none";
dom.style.cursor="grab";
dom.addEventListener("pointerdown",onDown);
window.addEventListener("pointermove",onMove);
window.addEventListener("pointerup",onUp);
function animate(){
  requestAnimationFrame(animate);
  if(idleSpin&&!dragging){orbit.azimuth+=0.0018;updateCamera();}
  renderer.render(scene,camera);
}
animate();

let lr=0.02, pos=randomStart(), steps=0, playing=false, converged=false, playTimer=null;
let prevVec=null, arrowList=[], maxTrail=40;

function syncBall(){
  const y=surfaceY(pos.x,pos.z);
  const newVec=new THREE.Vector3(pos.x,y,pos.z);
  ball.position.copy(newVec);
  if(prevVec){
    const fromVec=prevVec.clone(); fromVec.y+=0.015;
    const toVec=newVec.clone(); toVec.y+=0.015;
    const arrow=createArrow(fromVec,toVec);
    if(arrow){
      arrowsGroup.add(arrow);
      arrowList.push(arrow);
      if(arrowList.length>maxTrail){const old=arrowList.shift();arrowsGroup.remove(old);disposeArrow(old);}
    }
  }
  prevVec=newVec.clone();
}

const stepsEl=document.getElementById("gd-steps"), xEl=document.getElementById("gd-x"), zEl=document.getElementById("gd-z"), lossEl=document.getElementById("gd-loss");
const lrInput=document.getElementById("gd-lr"), lrVal=document.getElementById("gd-lr-val"), ticksEl=document.getElementById("gd-ticks");
const hintEl=document.getElementById("gd-hint"), convEl=document.getElementById("gd-converged");
const stepBtn=document.getElementById("gd-step-btn"), playBtn=document.getElementById("gd-play-btn"), resetBtn=document.getElementById("gd-reset-btn");

[0,0.25,0.5,0.75,1].forEach(t=>{
  const v=sliderToLr(t);
  const s=document.createElement("span");
  s.textContent=v.toFixed(3);
  ticksEl.appendChild(s);
});

function refreshUI(){
  stepsEl.textContent=steps;
  xEl.textContent=pos.x.toFixed(2);
  zEl.textContent=pos.z.toFixed(2);
  lossEl.textContent=lossOf(pos.x,pos.z).toFixed(3);
  lrInput.value=lrToSlider(lr);
  lrVal.textContent=lr.toFixed(3);
  if(lr>=LR_ESCAPE){
    hintEl.style.display="block";
    if(lr>=LR_UNSTABLE){hintEl.style.color="#a32d2d";hintEl.textContent="學習率過大:容易在多個區域最小值之間跳動,甚至彈到邊界";}
    else{hintEl.style.color="#854f0b";hintEl.textContent="學習率偏大:有機會跳出目前的區域最小值,找到更深的谷(甚至全域最小值)";}
  } else { hintEl.style.display="none"; }
  playBtn.textContent=playing?"暫停":"自動播放";
  playBtn.style.borderColor=playing?"#d85a30":"";
  stepBtn.disabled=converged;
  playBtn.disabled=converged;
  if(converged){
    const w=nearestWell(pos.x,pos.z);
    convEl.style.display="block";
    if(w.kind==="global"){convEl.style.color="#0f6e56";convEl.textContent="已收斂到全域最小值,拖曳畫面換角度觀察,或按「重新開始」換一個起始點。";}
    else{convEl.style.color="#854f0b";convEl.textContent="困在"+w.label+"(區域最小值)——這裡梯度也是 0,但不是全域最低點。試著調高學習率,看能不能跳出來。";}
  } else { convEl.style.display="none"; }
}

function doStep(){
  const [gx,gz]=gradOf(pos.x,pos.z);
  const nx=Math.max(-DOMAIN,Math.min(DOMAIN,pos.x-lr*gx));
  const nz=Math.max(-DOMAIN,Math.min(DOMAIN,pos.z-lr*gz));
  pos={x:nx,z:nz};
  steps++;
  syncBall();
  const [ngx,ngz]=gradOf(pos.x,pos.z);
  if(Math.hypot(ngx,ngz)<0.04){converged=true;stopPlaying();}
  refreshUI();
}
function stopPlaying(){playing=false;if(playTimer){clearInterval(playTimer);playTimer=null;}}
function togglePlay(){
  if(playing){stopPlaying();}
  else{playing=true;playTimer=setInterval(doStep,380);}
  refreshUI();
}
function reset(){
  stopPlaying();
  arrowList.forEach(a=>{arrowsGroup.remove(a);disposeArrow(a);});
  arrowList=[]; prevVec=null;
  pos=randomStart(); steps=0; converged=false;
  syncBall();
  refreshUI();
}

lrInput.addEventListener("input",e=>{lr=sliderToLr(parseFloat(e.target.value));refreshUI();});
stepBtn.addEventListener("click",doStep);
playBtn.addEventListener("click",togglePlay);
resetBtn.addEventListener("click",reset);

syncBall();
refreshUI();
})();
</script>
